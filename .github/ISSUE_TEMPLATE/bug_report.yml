name: Relatório de Bug
description: Informe um erro ou problema de desempenho no EmuStation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o **EmuStation** (`com.dimm.emustation`). Preencha os dados do aparelho para agilizar a correção.
  - type: input
    id: device
    attributes:
      label: Aparelho / Modelo e SoC
      placeholder: "Ex: Motorola Edge 60 Pro (Dimensity 8350 / Mali-G615) ou Galaxy M23 (SD 750G / Adreno 619)"
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Motor Gráfico Utilizado
      options:
        - Vulkan 1.3
        - OpenGL ES 3.2
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Título do Jogo / Serial (opcional)
      placeholder: "Ex: God of War II (SCUS-97399)"
  - type: textarea
    id: description
    attributes:
      label: Descrição do Problema e Passos para Reproduzir
      placeholder: Descreva o que aconteceu, FPS médio, resolução interna e como reproduzir.
    validations:
      required: true
