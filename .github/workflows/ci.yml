name: EmuStation CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    name: Web App (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Production Vite build
        run: npm run build

      - name: Verify EmuStation package & branding
        run: |
          grep -q 'EmuStation' index.html
          if [ -f "emucorex_repo/app/build.gradle.kts" ]; then
            grep -q 'com.dimm.emustation' emucorex_repo/app/build.gradle.kts
          fi

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: emustation-web-dist
          path: dist/
          retention-days: 7

  android-ci:
    name: Android Native (Kotlin + C++ ARM64 Check)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Android Gradle wrapper availability
        id: check_gradle
        run: |
          if [ -f "emucorex_repo/gradlew" ]; then
            echo "has_gradlew=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gradlew=false" >> "$GITHUB_OUTPUT"
            echo "Notice: Android Gradle wrapper not present in repository; running manifest & Gradle static checks."
          fi

      - name: Validate Android package configuration (com.dimm.emustation)
        run: |
          if [ -f "emucorex_repo/app/build.gradle.kts" ]; then
            grep -q 'namespace = "com.dimm.emustation"' emucorex_repo/app/build.gradle.kts
            grep -q 'applicationId = "com.dimm.emustation"' emucorex_repo/app/build.gradle.kts
          fi
          if [ -f "emucorex_repo/app/src/main/AndroidManifest.xml" ]; then
            grep -q 'com.dimm.emustation.action.LAUNCH_GAME' emucorex_repo/app/src/main/AndroidManifest.xml
          fi

      - name: Setup JDK 21
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.22.1'

      - name: Ensure Android API 37 platform & Hydrate Native Core
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" || true
          chmod +x scripts/prepare-android-core.sh
          ./scripts/prepare-android-core.sh

      - name: Build Android Debug APK (ARM64)
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        working-directory: emucorex_repo
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Android Debug APK
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: emustation-android-debug-apk
          path: emucorex_repo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
